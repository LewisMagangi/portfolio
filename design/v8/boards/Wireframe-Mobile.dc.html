<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wireframe — Home (mobile)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/gambit/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.wf-box{background:#ececea;border:1px solid #c9c9c5;border-radius:8px}
.wf-w{background:#fff}
.wf-g{background:#0b7a47;border-color:#0b7a47}
.wf-line{height:10px;border-radius:5px;background:#d6d6d2}
.wf-pin{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#0b7a47;color:#fff;font-family:var(--font-mono);font-size:10px;font-weight:600;flex:none}
.wf-note{font-size:12px;line-height:18px;color:#57534e}
.wf-s{padding:28px 16px;border-top:1px solid #c9c9c5;display:flex;flex-direction:column;gap:12px}
</style>
</helmet>
<div style="width: 390px; height: 2700px; box-sizing: border-box; background: #fafaf9; color: #0a0a0a; font-family: var(--font-sans); overflow: hidden;">
<div style="height: 56px; border-bottom: 1px solid #c9c9c5; padding: 0 16px; display: flex; align-items: center; gap: 10px; background: #fff;"><span class="wf-pin">1</span><div class="wf-box" style="width: 28px; height: 28px;"></div><div class="wf-line" style="width: 100px;"></div><div style="flex: 1;"></div><div class="wf-box" style="width: 44px; height: 44px;"></div></div>
<div style="padding: 32px 16px; display: flex; flex-direction: column; gap: 12px;"><span class="wf-pin">2</span><div class="wf-box" style="width: 220px; height: 22px; border-radius: 999px;"></div><div class="wf-line" style="height: 36px; width: 95%; border-radius: 6px;"></div><div class="wf-line" style="height: 36px; width: 70%; border-radius: 6px;"></div><div class="wf-line" style="width: 92%;"></div><div class="wf-box wf-g" style="height: 44px;"></div><div class="wf-box" style="height: 44px;"></div></div>
<div style="padding: 0 16px 24px; position: relative; height: 230px;"><span class="wf-pin" style="position: absolute; left: 8px; top: -8px; z-index: 1;">3</span><div class="wf-box wf-w" style="position: absolute; left: 16px; right: 48px; top: 0; height: 190px;"></div><div class="wf-box wf-w" style="position: absolute; right: 16px; bottom: 0; width: 90px; height: 170px; border-radius: 18px;"></div></div>
<div style="padding: 0 16px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;"><div class="wf-box wf-w" style="height: 60px;"></div><div class="wf-box wf-w" style="height: 60px;"></div><div class="wf-box wf-w" style="height: 60px;"></div><div class="wf-box wf-w" style="height: 60px;"></div></div>
<div class="wf-s"><div style="display: flex; gap: 8px; align-items: center;"><span class="wf-pin">4</span><strong>Case studies</strong></div><div style="display: flex; gap: 10px; overflow: hidden;"><div class="wf-box wf-w" style="flex: none; width: 320px; height: 360px;"></div><div class="wf-box wf-w" style="flex: none; width: 320px; height: 360px;"></div></div><div style="display: flex; gap: 6px;"><div style="width: 40px; height: 4px; background: #0b7a47; border-radius: 2px;"></div><div style="width: 20px; height: 4px; background: #c9c9c5; border-radius: 2px;"></div><div style="width: 20px; height: 4px; background: #c9c9c5; border-radius: 2px;"></div></div></div>
<div class="wf-s"><div style="display: flex; gap: 8px; align-items: center;"><span class="wf-pin">5</span><strong>Explore</strong></div><sc-for list="{{rows}}" as="r" hint-placeholder-count="7"><div style="height: 48px; border-top: 1px solid #e5e5e3; display: flex; align-items: center; justify-content: space-between;"><span style="font-size: 14px;">{{r}}</span><div class="wf-line" style="width: 16px;"></div></div></sc-for></div>
<div class="wf-s"><div style="display: flex; gap: 8px; align-items: center;"><span class="wf-pin">6</span><strong>Book a call</strong></div><div style="display: flex; gap: 10px; align-items: center;"><div class="wf-box" style="width: 48px; height: 48px; border-radius: 50%;"></div><div class="wf-line" style="width: 60%;"></div></div><div class="wf-box wf-g" style="height: 44px;"></div><div class="wf-box" style="height: 44px; background: transparent;"></div></div>
<div class="wf-s" style="background: #fff;"><div style="display: flex; gap: 8px; align-items: center;"><span class="wf-pin">7</span><strong>Footer</strong></div><div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;"><div class="wf-box" style="height: 90px;"></div><div class="wf-box" style="height: 90px;"></div><div class="wf-box" style="height: 90px; grid-column: span 2;"></div></div></div>
<div style="padding: 24px 16px; background: #f2f2f0; border-top: 1px solid #c9c9c5; display: flex; flex-direction: column; gap: 10px;">
<sc-for list="{{notes}}" as="n" hint-placeholder-count="7"><div style="display: flex; gap: 10px;"><span class="wf-pin">{{n.n}}</span><span class="wf-note">{{n.t}}</span></div></sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":2700}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rows: ['Services and pricing', 'How I got here', 'References', 'Off the clock', 'Questions', 'Your move'],
      notes: [
        { n: 1, t: 'Monogram, name and a 44px menu button. The menu opens the four links, theme icons and Book a call.' },
        { n: 2, t: 'Hero stacks; buttons are full width, Book a call first.' },
        { n: 3, t: 'Desktop + phone mockup, scaled down; phone overlaps the corner.' },
        { n: 4, t: 'Case studies swipe sideways; dots show position and jump on tap.' },
        { n: 5, t: 'The rest of Home becomes 48px rows that open each section or page.' },
        { n: 6, t: 'Portrait, one line, Pick a time; Send a message as the quiet option.' },
        { n: 7, t: 'Footer columns wrap to two; GitHub, LinkedIn, LeetCode, Lichess, Chess.com.' }
      ]
    };
  }
}
</script>
</body>
</html>
