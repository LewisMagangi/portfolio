<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Transcript, shared privately</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/gambit/tokens.css">
<link rel="stylesheet" href="ds/gambit/components/bundle.css">
<script src="ds/gambit/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px;transition:text-decoration-color 200ms cubic-bezier(.22,1,.36,1)}
a:hover{text-decoration-color:var(--ink)}
a:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}
.lm-page{background:var(--bg);color:var(--ink);font-family:var(--font-sans);min-height:100%;font-size:16px;line-height:24px}
.lm-sec{max-width:1080px;margin:0 auto;padding:96px 32px;display:flex;flex-direction:column;gap:48px;box-sizing:border-box}
.lm-rule{border-top:1px solid var(--line)}
.lm-head{display:flex;flex-direction:column;gap:16px;max-width:680px}
.lm-head h2,.lm-head p{margin:0}
.lm-head p{color:var(--ink-muted);font-size:18px;line-height:28px}
.lm-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.lm-small{margin:0;font-size:14px;line-height:20px;color:var(--ink-muted)}
.lm-hero{position:relative;overflow:hidden}
.lm-hero-in{position:relative;max-width:1080px;margin:0 auto;padding:96px 32px 96px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:48px;align-items:center;box-sizing:border-box}
.lm-hero-copy{display:flex;flex-direction:column;gap:24px;min-width:0}
.lm-hero h1{margin:0;max-width:680px}
.lm-hero .lead{margin:0;max-width:560px;color:var(--ink-muted)}
.lm-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px;counter-reset:s}
.lm-steps li{display:flex;flex-direction:column;gap:8px;padding-top:16px;border-top:1px solid var(--line);counter-increment:s}
.lm-steps li::before{content:counter(s);font-family:var(--font-mono);font-size:12px;line-height:16px;color:var(--ink-subtle)}
.lm-steps strong{font-size:18px;line-height:28px;font-weight:500}
.lm-steps span{color:var(--ink-muted)}
.lm-refs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.lm-more{border-top:1px solid var(--line);padding-top:16px}
.lm-more summary{display:inline-flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;list-style:none;font-weight:500;border-radius:6px}
.lm-more summary::-webkit-details-marker{display:none}
.lm-more summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.lm-more summary svg{transition:transform 300ms cubic-bezier(.22,1,.36,1)}
.lm-more[open] summary svg{transform:rotate(180deg)}
.lm-more .lm-refs{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:16px}
.lm-off{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:48px;align-items:start}
.lm-now{display:flex;flex-direction:column;gap:16px}
.lm-now h3{margin:0;font-size:18px;line-height:28px;font-weight:500}
.lm-now ul{list-style:none;margin:0;padding:0}
.lm-now li{display:flex;flex-direction:column;padding:12px 0;border-top:1px solid var(--line)}
.lm-now li span{font-size:14px;line-height:20px;color:var(--ink-muted)}
.lm-close{position:relative;overflow:hidden}
.lm-close-in{position:relative;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:64px;align-items:center}
.lm-facts{list-style:none;margin:0;padding:24px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.lm-facts li{display:flex;gap:12px;align-items:center;color:var(--ink-muted);font-size:14px;line-height:20px}
.lm-facts li:first-child{padding-bottom:12px;border-bottom:1px solid var(--line);color:var(--ink)}
.lm-facts img{width:48px;height:48px;border-radius:50%;object-fit:cover;border:1px solid var(--line-strong)}
@media (max-width:960px){.lm-hero-in,.lm-close-in,.lm-off{grid-template-columns:1fr;gap:48px}.lm-refs{grid-template-columns:1fr}.lm-more .lm-refs{grid-template-columns:1fr}}
@media (max-width:820px){.lm-steps{grid-template-columns:1fr;gap:16px}}
@media (max-width:640px){.lm-sec{padding:64px 16px;gap:32px}.lm-hero-in{padding:48px 16px 64px}.lm-head p{font-size:16px;line-height:24px}}
</style>
</helmet>
<div class="lm-page" data-theme="{{theme}}">
<x-import component-from-global-scope="Gambit.RevealObserver"></x-import>
<x-import component-from-global-scope="Gambit.SiteNav" items="{{nav}}" active="" theme="{{theme}}" on-theme="{{setTheme}}" home-href="Main.dc.html" book-href="Book.dc.html" cta-label="Book a call"></x-import>
<main id="gb-main">
<header><section class="lm-sec" style="padding-top:96px;padding-bottom:32px;gap:16px">
<div class="lm-head"><h1 class="display" style="margin:0">Academic transcript</h1><p>BSc Computer Forensics Science, Jaramogi Oginga Odinga University of Science and Technology. Shared privately through an approved request.</p></div>
</section></header>
<div><section class="lm-sec" style="padding-top:0;gap:24px">
<x-import component-from-global-scope="Gambit.AccessViewer" state="{{state}}" viewer="Amina Wanjiku, Savanna Labs" expires="{{expires}}" days-left="{{left}}" days="60" doc-title="Academic transcript" doc-org="BSc Computer Forensics Science, JOOUST" viewed-on="5 Nov 2026" request-href="Education.dc.html#transcript"></x-import>
<p class="lm-small">Sample requester shown for the design. The real page loads the requester from the approved link and never indexes in search.</p>
</section></div>
</main>
<x-import component-from-global-scope="Gambit.SiteFooter" columns="{{footer}}" legal="{{legal}}" blurb="Software engineer in Nairobi, Kenya. Secure web systems, AI and ML." home-href="Main.dc.html" book-href="Book.dc.html"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"state":{"editor":"enum","options":["granted","expired"],"default":"granted"},"$preview":{"width":1440,"height":1800}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var theme = (this.state && this.state.theme) || this.props.theme || 'dark';
    return {
      theme: theme, yes: true,
      setTheme: function (v) { self.setState({ theme: v === 'system' ? 'dark' : v }); },
      nav: [{ label: 'Work', href: 'Work.dc.html' }, { label: 'Services', href: 'Services.dc.html' }, { label: 'Career', href: 'Career.dc.html' }, { label: 'Chess', href: 'Chess.dc.html' }],
      footer: [
        { title: 'Explore', links: [{ label: 'Work', href: 'Work.dc.html' }, { label: 'Services', href: 'Services.dc.html' }, { label: 'Career', href: 'Career.dc.html' }, { label: 'Chess', href: 'Chess.dc.html' }, { label: 'AI and ML', href: 'AI-ML.dc.html' }] },
        { title: 'More', links: [{ label: 'Education', href: 'Education.dc.html' }, { label: 'Certificates', href: 'Certificates.dc.html' }, { label: 'Reading', href: 'Reading.dc.html' }, { label: 'About', href: 'About.dc.html' }, { label: 'Blog', href: 'Blog.dc.html' }, { label: 'Contact', href: 'Contact.dc.html' }] },
        { title: 'Elsewhere', links: [{ label: 'GitHub', href: 'https://github.com/LewisMagangi', external: true }, { label: 'LinkedIn', href: 'https://www.linkedin.com/in/lewis-magangi/', external: true }, { label: 'LeetCode', href: 'https://leetcode.com/u/LewisMagangi/', external: true }, { label: 'Codewars', href: 'https://www.codewars.com/users/LewisMagangi', external: true }, { label: 'Lichess', href: 'https://lichess.org/@/Lique', external: true }, { label: 'Chess.com', href: 'https://www.chess.com/member/liquelaliqour', external: true }] }
      ],
      legal: [{ label: 'Privacy', href: 'Legal.dc.html#privacy' }, { label: 'Terms', href: 'Legal.dc.html#terms' }],
      state: this.props.state || 'granted', expires: (this.props.state === 'expired') ? '4 Jan 2027' : '4 Jan 2027', left: (this.props.state === 'expired') ? 0 : 60
    };
  }
}
</script>
</body>
</html>
