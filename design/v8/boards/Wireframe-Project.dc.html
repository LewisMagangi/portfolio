<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wireframe — Project detail</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/gambit/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#0b7a47}
.wf-box{background:#ececea;border:1px solid #c9c9c5;border-radius:8px}
.wf-line{height:10px;border-radius:5px;background:#d6d6d2}
.wf-pin{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#0b7a47;color:#fff;font-family:var(--font-mono);font-size:12px;font-weight:600;flex:none}
.wf-note{font-family:var(--font-mono);font-size:12px;line-height:18px;color:#57534e}
.wf-lab{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#6b6b68}
</style>
</helmet>
<div style="background: #fafaf9; color: #0a0a0a; font-family: var(--font-sans); min-height: 100%;">
<div style="height: 64px; border-bottom: 1px solid #c9c9c5;"><div style="max-width: 1080px; height: 64px; margin: 0 auto; padding: 0 32px; display: flex; align-items: center; gap: 24px;"><div class="wf-box" style="width: 28px; height: 28px;"></div><div class="wf-line" style="width: 120px;"></div><div style="flex: 1;"></div><div class="wf-box" style="width: 140px; height: 32px; border-radius: 999px;"></div><div class="wf-box" style="width: 110px; height: 32px;"></div></div></div>

<div style="max-width: 1080px; margin: 0 auto; padding: 56px 32px 0; display: flex; flex-direction: column; gap: 28px;">
<div style="display: flex; gap: 10px; align-items: center;"><span class="wf-pin">1</span><span class="wf-lab">← Work / Solar-Powered Water ATM</span></div>
<div style="display: flex; gap: 10px; align-items: center;"><span class="wf-pin">2</span><div class="wf-box" style="width: 190px; height: 24px;"></div><div class="wf-box" style="width: 90px; height: 24px;"></div></div>
<div class="wf-line" style="height: 52px; width: 62%; border-radius: 8px;"></div>
<div style="display: flex; flex-direction: column; gap: 8px; max-width: 680px;"><div class="wf-line" style="width: 100%;"></div><div class="wf-line" style="width: 85%;"></div></div>
<div style="display: flex; gap: 10px; align-items: center;"><span class="wf-pin">3</span><div style="flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border: 1px solid #c9c9c5; border-radius: 8px; background: #fff;"><sc-for list="{{four}}" as="x" hint-placeholder-count="4"><div style="padding: 18px; border-left: 1px solid #c9c9c5; display: flex; flex-direction: column; gap: 8px;"><span class="wf-lab">{{x}}</span><div class="wf-line" style="width: 70%;"></div></div></sc-for></div></div>
<div style="display: flex; gap: 10px; align-items: flex-start;"><span class="wf-pin">4</span><div class="wf-box" style="flex: 1; height: 520px; display: grid; place-items: center;"><span class="wf-lab">desktop + phone mockup</span></div></div>
</div>

<div style="max-width: 1080px; margin: 0 auto; padding: 64px 32px; display: flex; gap: 64px;">
<div style="flex: 3; display: flex; flex-direction: column; gap: 40px;">
<div style="display: flex; flex-direction: column; gap: 12px;"><div style="display: flex; gap: 10px; align-items: center;"><span class="wf-pin">5</span><span class="wf-lab">The problem</span></div><div class="wf-line" style="width: 95%;"></div><div class="wf-line" style="width: 90%;"></div><div class="wf-line" style="width: 60%;"></div></div>
<div style="display: flex; flex-direction: column; gap: 12px;"><div style="display: flex; gap: 10px; align-items: center;"><span class="wf-pin">6</span><span class="wf-lab">What I did · numbered moves</span></div>
<sc-for list="{{four}}" as="x" hint-placeholder-count="4"><div style="display: flex; gap: 14px; padding: 12px 0; border-top: 1px solid #c9c9c5;"><div class="wf-line" style="width: 24px;"></div><div style="flex: 1; display: flex; flex-direction: column; gap: 8px;"><div class="wf-line" style="width: 40%; height: 12px;"></div><div class="wf-line" style="width: 90%;"></div></div></div></sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 12px;"><div style="display: flex; gap: 10px; align-items: center;"><span class="wf-pin">7</span><span class="wf-lab">Architecture</span></div>
<div class="wf-box" style="background: #fff; padding: 28px; display: flex; align-items: center; gap: 16px;"><div class="wf-box" style="flex: 1; height: 64px;"></div><div style="width: 32px; height: 1px; background: #8c8c88;"></div><div class="wf-box" style="flex: 1; height: 64px;"></div><div style="width: 32px; height: 1px; background: #8c8c88;"></div><div class="wf-box" style="flex: 1; height: 64px;"></div><div style="width: 32px; height: 1px; background: #8c8c88;"></div><div class="wf-box" style="flex: 1; height: 64px;"></div></div>
</div>
<div style="display: flex; flex-direction: column; gap: 12px;"><div style="display: flex; gap: 10px; align-items: center;"><span class="wf-pin">8</span><span class="wf-lab">Outcome</span></div><div class="wf-box" style="height: 96px; background: #fff;"></div></div>
</div>
<div style="flex: 1.2; display: flex; flex-direction: column; gap: 16px;"><div style="display: flex; gap: 10px; align-items: center;"><span class="wf-pin">9</span><span class="wf-lab">Sticky aside</span></div><div class="wf-box" style="height: 220px; background: #fff;"></div><div class="wf-box" style="height: 40px;"></div><div class="wf-box" style="height: 40px; background: transparent;"></div></div>
</div>

<div style="max-width: 1080px; margin: 0 auto; padding: 0 32px 56px;"><div style="display: flex; gap: 10px; align-items: center;"><span class="wf-pin">10</span><div style="flex: 1; display: flex; justify-content: space-between; border-top: 1px solid #c9c9c5; padding-top: 24px;"><div class="wf-line" style="width: 200px; height: 14px;"></div><div class="wf-line" style="width: 200px; height: 14px;"></div></div></div></div>

<div style="border-top: 1px solid #c9c9c5; background: #f2f2f0;">
<div style="max-width: 1080px; margin: 0 auto; padding: 40px 32px 56px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 48px;">
<sc-for list="{{notes}}" as="n" hint-placeholder-count="10">
<div style="display: flex; gap: 12px;"><span class="wf-pin">{{n.n}}</span><span class="wf-note">{{n.t}}</span></div>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2300}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      four: ['Role', 'Team', 'Timeline', 'Stack'],
      notes: [
        { n: 1, t: 'Breadcrumb back to Work. Keeps the same nav as Home.' },
        { n: 2, t: 'Award or status tag first, then period. Amber award tag only for real rankings.' },
        { n: 3, t: 'Fact strip: role, team size, timeline, stack. Mono labels, one line each.' },
        { n: 4, t: 'Desktop + phone mockup. Real screenshots from the admin replace the illustrative schematic.' },
        { n: 5, t: 'The problem in two or three sentences: who it serves and what was broken.' },
        { n: 6, t: 'What I did as numbered moves: one line headline + one line of detail, outcome first.' },
        { n: 7, t: 'Simple left-to-right architecture: device → API → database → dashboard. Boxes and hairlines, no illustrations.' },
        { n: 8, t: 'Outcome: the measurable result (ranking, users, endpoints) and what I would do next.' },
        { n: 9, t: 'Sticky aside on desktop: links (Live, Code, Demo video), tags, and a “Book a call about this” button. Stacks below on mobile.' },
        { n: 10, t: 'Previous / next project navigation.' }
      ]
    };
  }
}
</script>
</body>
</html>
