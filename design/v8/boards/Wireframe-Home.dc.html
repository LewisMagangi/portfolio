<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wireframe — Home</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/gambit/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.wf-box{background:#ececea;border:1px solid #c9c9c5;border-radius:8px}
.wf-w{background:#fff}
.wf-line{height:10px;border-radius:5px;background:#d6d6d2}
.wf-g{background:#0b7a47;border-color:#0b7a47}
.wf-pin{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#0b7a47;color:#fff;font-family:var(--font-mono);font-size:12px;font-weight:600;flex:none}
.wf-note{font-size:13px;line-height:20px;color:#57534e}
.wf-sec{max-width:1080px;margin:0 auto;padding:56px 32px;display:flex;flex-direction:column;gap:20px;box-sizing:border-box}
.wf-head{display:flex;gap:12px;align-items:center}
.wf-next{display:flex;gap:8px;align-items:center;font-size:12px;color:#6b6b68}
.wf-next i{width:60px;height:8px;border-radius:4px;background:#0a0a0a}
</style>
</helmet>
<div style="background: #fafaf9; color: #0a0a0a; font-family: var(--font-sans); min-height: 100%;">
<div style="height: 64px; border-bottom: 1px solid #c9c9c5; background: #fff;"><div style="max-width: 1080px; height: 64px; margin: 0 auto; padding: 0 32px; display: flex; align-items: center; gap: 16px; box-sizing: border-box;"><span class="wf-pin">1</span><div class="wf-box" style="width: 28px; height: 28px;"></div><div class="wf-line" style="width: 110px;"></div><div style="flex: 1; display: flex; gap: 18px; justify-content: center;"><div class="wf-line" style="width: 40px;"></div><div class="wf-line" style="width: 48px;"></div><div class="wf-line" style="width: 48px;"></div><div class="wf-line" style="width: 40px;"></div></div><div class="wf-box" style="width: 96px; height: 32px; border-radius: 999px;"></div><div class="wf-box wf-g" style="width: 120px; height: 32px;"></div></div></div>

<section style="border-bottom: 1px solid #c9c9c5;"><div class="wf-sec" style="flex-direction: row; gap: 48px; align-items: center; padding-top: 88px;">
<div style="flex: 1.1; display: flex; flex-direction: column; gap: 16px;"><span class="wf-pin">2</span><div class="wf-box" style="width: 260px; height: 24px; border-radius: 999px;"></div><div class="wf-line" style="height: 44px; width: 95%; border-radius: 8px;"></div><div class="wf-line" style="height: 44px; width: 70%; border-radius: 8px;"></div><div class="wf-line" style="width: 90%;"></div><div class="wf-line" style="width: 75%;"></div><div style="display: flex; gap: 10px;"><div class="wf-box wf-g" style="width: 230px; height: 40px;"></div><div class="wf-box" style="width: 120px; height: 40px;"></div><div class="wf-box" style="width: 110px; height: 40px; background: transparent;"></div></div></div>
<div style="flex: 1; position: relative; height: 340px;"><span class="wf-pin" style="position: absolute; left: -12px; top: -12px; z-index: 1;">3</span><div class="wf-box wf-w" style="position: absolute; inset: 0 48px 40px 0;"></div><div class="wf-box" style="position: absolute; right: 0; bottom: 0; width: 120px; height: 230px; border-radius: 22px; background: #fff;"></div></div>
</div>
<div class="wf-sec" style="padding-top: 0;"><span class="wf-pin">4</span><div class="wf-line" style="height: 14px; width: 30%; background: #0a0a0a;"></div><div class="wf-line" style="height: 14px; width: 30%;"></div></div>

<sc-for list="{{secs}}" as="s" hint-placeholder-count="9">
<section style="border-bottom: 1px solid #c9c9c5;"><div class="wf-sec">
<div class="wf-head"><span class="wf-pin">{{s.pin}}</span><strong style="font-size: 18px;">{{s.name}}</strong><span class="wf-note">{{s.pattern}}</span></div>
<div style="display: flex; gap: 16px; height: {{s.h}}px;">
<sc-for list="{{s.cols}}" as="c" hint-placeholder-count="3"><div class="wf-box wf-w" style="flex: {{c}};"></div></sc-for>
</div>
<div class="wf-next">Next-move link <i></i></div>
</div></section>
</sc-for>

<div style="background: #f2f2f0;"><div class="wf-sec" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 48px;">
<sc-for list="{{notes}}" as="n" hint-placeholder-count="14"><div style="display: flex; gap: 12px;"><span class="wf-pin">{{n.n}}</span><span class="wf-note">{{n.t}}</span></div></sc-for>
</div></div>
</section></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":3600}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      secs: [
        { pin: 5, name: 'Work, 1. e4', pattern: 'Three case studies, outcome first, live sites in the frames', h: 260, cols: [1.1, 1] },
        { pin: 6, name: 'Tagline reveal', pattern: 'Two lines that light word by word', h: 120, cols: [1] },
        { pin: 7, name: 'Services and pricing, 2. Nf3', pattern: 'Four services, three tiers, three steps', h: 320, cols: [1, 1, 1] },
        { pin: 8, name: 'How I got here, 3. Bc4', pattern: 'Four moves on a rail, awards folded in', h: 180, cols: [1] },
        { pin: 9, name: 'References and certificates, 4. O‑O', pattern: 'Three letters, two more on request, certificate images', h: 260, cols: [1, 1, 1] },
        { pin: 10, name: 'Off the clock, 5. d4', pattern: 'Challenge board and reading now', h: 200, cols: [1.4, 1] },
        { pin: 11, name: 'Questions, 6. Nc3', pattern: 'Six closed questions', h: 160, cols: [1] },
        { pin: 12, name: 'Your move, 7. Re1', pattern: 'The hero action again, with what to expect', h: 160, cols: [1.4, 1] }
      ],

      notes: [
        { n: 1, t: 'Floating nav pill: Work, Services, Career, Chess, theme icons and a white “Book a call”. Full height menu under 820px.' },
        { n: 2, t: 'Headline with a white to grey text gradient, one paragraph naming the four services and who they are for, then “Book a free discovery call” and “See the work”. Hiring managers get a CV link in the line below.' },
        { n: 3, t: 'Afya Bora running live in the desktop and phone frames. Select to use it, Esc to hand the page back, an icon opens it in a new tab.' },
        { n: 4, t: 'No stat row. The page starts its story straight after the hero.' },
        { n: 5, t: 'A move list pinned at the left follows the section in view; on phones it becomes a bottom bar with the booking button.' },
        { n: 6, t: 'Every system I ship is a move I can defend. Words go from 30% to full ink as they cross the reading line.' },
        { n: 7, t: 'Standard $400, Premium $800, VVIP $1,200, typical per project. Each tier says what it adds.' },
        { n: 8, t: 'Irene Aragona (ALX), Joseph Kasoa (KenGen), Denver Kulecho (Enactus). Dr Castro Yoga and Michael Rutto behind “Two more references”.' },
        { n: 9, t: 'Certificates as images; Verify stays closed until asked for.' },
        { n: 10, t: 'Lichess, Chess.com, LeetCode, Codewars, with live ratings where the platform shares them.' },
        { n: 11, t: 'The last call to action matches the first word for word.' },
        { n: 12, t: 'Sections are 96px apart and rise 32px once as they enter. Reduced motion keeps the fades and drops the movement.' }
      ]
    };
  }
}
</script>
</body>
</html>
